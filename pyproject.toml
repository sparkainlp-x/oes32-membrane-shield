[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oes32-membrane-shield"
version = "1.0.0"
description = "Authenticated OES-32 state-machine membrane shield"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manus AI" }]
keywords = ["state-machine", "authentication", "symmetry", "circuit-breaker"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sparkainlp-x/oes32-membrane-shield"
Repository = "https://github.com/sparkainlp-x/oes32-membrane-shield"
Issues = "https://github.com/sparkainlp-x/oes32-membrane-shield/issues"

[project.scripts]
oes32-simulate = "oes32_membrane_shield.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oes32_membrane_shield = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["oes32_membrane_shield"]
