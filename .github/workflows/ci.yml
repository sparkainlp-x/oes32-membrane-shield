name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest pytest-cov
      - run: pytest --cov=oes32_membrane_shield --cov-report=term-missing --cov-fail-under=90

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . setuptools wheel ruff mypy build pip-audit
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python -m build --wheel --no-isolation
      - run: pip-audit -r requirements.txt --no-deps
